name: iOS – build and CocoaPods lint

on:
  pull_request:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing x.y.z tag to build
        required: true
        type: string

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Validate release versions
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" bash scripts/release-version.sh
      - name: Build UIKit demo with SPM
        run: xcodebuild -project ios/Example/OggOpusDemo.xcodeproj -scheme OggOpusDemo -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3' }
      - run: gem install cocoapods --no-document
      - run: pod lib lint OggOpus.podspec --allow-warnings
